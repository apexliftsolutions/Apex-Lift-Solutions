<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Client Portal — Apex Lift Solutions</title>
  <link rel="preload" href="assets/fonts/barlow-condensed-black-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/barlow-regular-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="portal-auth.css"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
  <meta name="theme-color" content="#000000"/>
</head>
<body>
<div class="hero-bg" style="position:fixed;inset:0;"><div class="hero-grid"></div><div class="hero-glow"></div></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div><span id="load-msg">Signing in...</span></div>

<div class="portal-wrap">
  <div class="portal-card">
    <img src="logo.jpg" alt="Apex Lift Solutions" class="portal-logo" width="342" height="120" decoding="async"/>
    <div class="portal-tabs">
      <button class="portal-tab active" onclick="switchTab('login',this)">Sign In</button>
      <button class="portal-tab" onclick="switchTab('register',this)">Register</button>
    </div>

    <!-- SIGN IN -->
    <div class="tab-content active" id="tab-login">
      <div class="portal-title">Client <em>Login</em></div>
      <p class="portal-sub">Access your quotes, invoices, and service history.</p>
      <div class="fg">
        <label>Email Address</label>
        <input type="text" id="login-email" placeholder="email" autocomplete="email"/>
      </div>
      <div class="fg">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"/>
          <button type="button" class="pw-eye" onclick="togglePw('login-pass',this)" title="Show/hide password">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="err" id="login-err"></div>
      <button class="btn-primary" onclick="handleLogin()" style="width:100%;margin-top:4px;">Sign In</button>
      <a href="portal-forgot.html" class="forgot-link">Forgot your password?</a>
    </div>

    <!-- REGISTER -->
    <div class="tab-content" id="tab-register">
      <div class="portal-title">Create <em>Account</em></div>
      <p class="portal-sub">New customer? Register below — we'll activate your account within 1 business day.</p>
      <div class="fg"><label>Full Name *</label><input type="text" id="reg-name" placeholder="John Smith" autocomplete="name"/></div>
      <div class="fg"><label>Company Name</label><input type="text" id="reg-company" placeholder="Your Company LLC" autocomplete="organization"/></div>
      <div class="fg"><label>Email Address *</label><input type="email" id="reg-email" placeholder="you@company.com" autocomplete="email"/></div>
      <div class="fg"><label>Phone Number</label><input type="tel" id="reg-phone" placeholder="(555) 000-0000" autocomplete="tel"/></div>
      <div class="fg">
        <label>Password * <span style="color:var(--grey);font-weight:400;font-size:.68rem;">(min 8 characters)</span></label>
        <div class="pw-wrap">
          <input type="password" id="reg-pass" placeholder="Create a password" autocomplete="new-password" oninput="checkStrength(this.value)"/>
          <button type="button" class="pw-eye" onclick="togglePw('reg-pass',this)" title="Show/hide password">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="str-bar"><div class="str-fill" id="str-fill"></div></div>
        <div class="str-label" id="str-label"></div>
      </div>
      <div class="fg">
        <label>Confirm Password *</label>
        <div class="pw-wrap">
          <input type="password" id="reg-pass2" placeholder="Repeat password" autocomplete="new-password"/>
          <button type="button" class="pw-eye" onclick="togglePw('reg-pass2',this)" title="Show/hide password">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="err" id="reg-err"></div>
      <div class="suc" id="reg-suc"></div>
      <button class="btn-primary" onclick="handleRegister()" style="width:100%;margin-top:4px;">Create Account</button>
    </div>

    <a href="index.html" class="back-link">← Back to Website</a>
  </div>
</div>

<script src="vendor/supabase-js-2.116.0.umd.js?v=2026-09-08.v24.9-hardening"></script>
<script src="portal-login.js"></script>
</body>
</html>
