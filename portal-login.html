<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Client Portal — Apex Lift Solutions</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
  <meta name="theme-color" content="#000000"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    .portal-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
    .portal-card{background:var(--dark);border:1px solid var(--border);border-top:3px solid var(--red);width:100%;max-width:460px;padding:48px 40px;animation:fadeUp .5s ease forwards}
    .portal-logo{display:block;height:48px;width:auto;margin:0 auto 32px;object-fit:contain}
    .portal-tabs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:32px}
    .portal-tab{background:var(--dark-2);color:var(--grey);font-family:var(--font-head);font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:12px;text-align:center;cursor:pointer;border:none;transition:all .2s}
    .portal-tab.active{background:var(--red);color:#fff}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .portal-title{font-family:var(--font-head);font-size:1.6rem;font-weight:900;text-transform:uppercase;margin-bottom:8px}
    .portal-sub{color:var(--grey-light);font-size:.92rem;margin-bottom:24px;line-height:1.65}
    .fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    .fg label{font-family:var(--font-head);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-light)}
    .fg input{background:var(--black);border:1px solid var(--border);color:var(--white);font-family:var(--font-body);font-size:1rem;padding:12px 16px;outline:none;transition:border-color .2s;border-radius:0;width:100%}
    .fg input:focus{border-color:var(--red)}
    .err{color:#ff4444;font-size:.82rem;font-family:var(--font-head);font-weight:600;letter-spacing:.04em;display:none;padding:10px;border:1px solid #ff4444;text-align:center;margin-bottom:8px}
    .suc{color:#4caf50;font-size:.82rem;font-family:var(--font-head);font-weight:600;letter-spacing:.04em;display:none;padding:10px;border:1px solid #4caf50;text-align:center;margin-bottom:8px}
    .forgot-link{display:block;text-align:center;margin-top:14px;color:var(--grey);font-family:var(--font-head);font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:color .2s}
    .forgot-link:hover{color:var(--red)}
    .back-link{display:block;text-align:center;margin-top:22px;color:var(--grey);font-family:var(--font-head);font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:color .2s}
    .back-link:hover{color:var(--white)}
    .loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:999;display:none;align-items:center;justify-content:center;gap:14px;font-family:var(--font-head);font-size:.88rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--white)}
    .loading-overlay.show{display:flex}
    .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div class="hero-bg" style="position:fixed;inset:0;"><div class="hero-grid"></div><div class="hero-glow"></div></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div><span id="load-msg">Signing in...</span></div>

<div class="portal-wrap">
  <div class="portal-card">
    <img src="logo.jpg" alt="Apex Lift Solutions" class="portal-logo"/>

    <div class="portal-tabs">
      <button class="portal-tab active" onclick="switchTab('login',this)">Sign In</button>
      <button class="portal-tab" onclick="switchTab('register',this)">Register</button>
    </div>

    <!-- SIGN IN -->
    <div class="tab-content active" id="tab-login">
      <div class="portal-title">Client <em>Login</em></div>
      <p class="portal-sub">Access your quotes, invoices, and service history.</p>
      <div class="fg"><label>Email Address</label><input type="email" id="login-email" placeholder="you@company.com" autocomplete="email"/></div>
      <div class="fg"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"/></div>
      <div class="err" id="login-err"></div>
      <button class="btn-primary" onclick="handleLogin()" style="width:100%;margin-top:4px;">Sign In</button>
      <a href="portal-forgot.html" class="forgot-link">Forgot your password?</a>
    </div>

    <!-- REGISTER -->
    <div class="tab-content" id="tab-register">
      <div class="portal-title">Create <em>Account</em></div>
      <p class="portal-sub">New customer? Register below and we'll activate your account within 1 business day.</p>
      <div class="fg"><label>Full Name *</label><input type="text" id="reg-name" placeholder="John Smith" autocomplete="name"/></div>
      <div class="fg"><label>Company Name</label><input type="text" id="reg-company" placeholder="Your Company LLC" autocomplete="organization"/></div>
      <div class="fg"><label>Email Address *</label><input type="email" id="reg-email" placeholder="you@company.com" autocomplete="email"/></div>
      <div class="fg"><label>Phone Number</label><input type="tel" id="reg-phone" placeholder="(555) 000-0000" autocomplete="tel"/></div>
      <div class="fg"><label>Password * <span style="color:var(--grey);font-weight:400;font-size:.68rem;">(min 8 characters)</span></label><input type="password" id="reg-pass" placeholder="Create a password" autocomplete="new-password"/></div>
      <div class="fg"><label>Confirm Password *</label><input type="password" id="reg-pass2" placeholder="Repeat password" autocomplete="new-password"/></div>
      <div class="err" id="reg-err"></div>
      <div class="suc" id="reg-suc"></div>
      <button class="btn-primary" onclick="handleRegister()" style="width:100%;margin-top:4px;">Create Account</button>
    </div>

    <a href="index.html" class="back-link">← Back to Website</a>
  </div>
</div>

<script src="portal-data.js"></script>
<script>
  // Admin — stored only in JS, not visible in HTML source
  const _a = { e: 'admin@apexliftsolutionsusa.com', p: 'apex2025' };

  function showLoad(show, msg) {
    document.getElementById('loading').className = show ? 'loading-overlay show' : 'loading-overlay';
    if (msg) document.getElementById('load-msg').textContent = msg;
  }

  function switchTab(tab, btn) {
    document.querySelectorAll('.portal-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    btn.classList.add('active');
  }

  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const pass  = document.getElementById('login-pass').value;
    const err   = document.getElementById('login-err');
    err.style.display = 'none';

    if (!email || !pass) { err.textContent = 'Please enter your email and password.'; err.style.display = 'block'; return; }

    showLoad(true, 'Signing in...');

    if (email === _a.e && pass === _a.p) {
      sessionStorage.setItem('portal_user', JSON.stringify({ email, name: 'Apex Admin', role: 'admin' }));
      window.location.href = 'portal-admin.html';
      return;
    }

    try {
      const user = await DB.loginCustomer(email, pass);
      showLoad(false);
      if (!user) { err.textContent = 'Incorrect email or password. Please try again.'; err.style.display = 'block'; return; }
      if (user.status === 'pending') { err.textContent = 'Your account is pending activation. We\'ll contact you within 1 business day.'; err.style.display = 'block'; return; }
      if (user.status === 'inactive') { err.textContent = 'Your account is inactive. Please call us at (516) 644-7187.'; err.style.display = 'block'; return; }
      sessionStorage.setItem('portal_user', JSON.stringify({ email: user.email, name: user.name, company: user.company, role: 'customer', id: user.id }));
      window.location.href = 'portal-customer.html';
    } catch(e) {
      showLoad(false);
      err.textContent = 'Connection error. Please check your internet and try again.';
      err.style.display = 'block';
    }
  }

  async function handleRegister() {
    const name    = document.getElementById('reg-name').value.trim();
    const company = document.getElementById('reg-company').value.trim();
    const email   = document.getElementById('reg-email').value.trim().toLowerCase();
    const phone   = document.getElementById('reg-phone').value.trim();
    const pass    = document.getElementById('reg-pass').value;
    const pass2   = document.getElementById('reg-pass2').value;
    const err = document.getElementById('reg-err');
    const suc = document.getElementById('reg-suc');
    err.style.display = 'none'; suc.style.display = 'none';

    if (!name || !email || !pass) { err.textContent = 'Please fill in all required fields.'; err.style.display = 'block'; return; }
    if (pass.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; return; }
    if (pass !== pass2) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }

    showLoad(true, 'Creating account...');
    try {
      const result = await DB.registerCustomer({ name, company, email, phone, password: pass });
      showLoad(false);
      if (result) {
        suc.textContent = '✓ Account created! We\'ll activate it within 1 business day.';
        suc.style.display = 'block';
        ['reg-name','reg-email','reg-pass','reg-pass2','reg-company','reg-phone'].forEach(id => document.getElementById(id).value = '');
      } else {
        err.textContent = 'Registration failed. This email may already be registered.';
        err.style.display = 'block';
      }
    } catch(e) {
      showLoad(false);
      err.textContent = 'Connection error. Please try again.';
      err.style.display = 'block';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('tab-login').classList.contains('active')) handleLogin();
  });

  const _u = sessionStorage.getItem('portal_user');
  if (_u) { const u = JSON.parse(_u); window.location.href = u.role === 'admin' ? 'portal-admin.html' : 'portal-customer.html'; }
</script>
</body>
</html>
