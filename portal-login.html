<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Client Portal — Apex Lift Solutions</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
  <meta name="theme-color" content="#000000"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    .portal-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
    .portal-card{background:var(--dark);border:1px solid var(--border);border-top:3px solid var(--red);width:100%;max-width:460px;padding:48px 40px;animation:fadeUp .5s ease forwards}
    .portal-logo{display:block;height:48px;width:auto;margin:0 auto 32px;object-fit:contain}
    .portal-tabs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:32px}
    .portal-tab{background:var(--dark-2);color:var(--grey);font-family:var(--font-head);font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:12px;text-align:center;cursor:pointer;border:none;transition:all .2s}
    .portal-tab.active{background:var(--red);color:#fff}
    .tab-content{display:none}.tab-content.active{display:block}
    .portal-title{font-family:var(--font-head);font-size:1.6rem;font-weight:900;text-transform:uppercase;margin-bottom:8px}
    .portal-sub{color:var(--grey-light);font-size:.92rem;margin-bottom:24px;line-height:1.65}
    .fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    .fg label{font-family:var(--font-head);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-light)}
    .fg input{background:var(--black);border:1px solid var(--border);color:var(--white);font-family:var(--font-body);font-size:1rem;padding:12px 16px;outline:none;transition:border-color .2s;border-radius:0;width:100%;box-sizing:border-box}
    .fg input:focus{border-color:var(--red)}
    /* Password wrapper with eye toggle */
    .pw-wrap{position:relative;display:flex;align-items:stretch}
    .pw-wrap input{padding-right:44px;flex:1}
    .pw-eye{position:absolute;right:0;top:0;bottom:0;width:42px;background:transparent;border:none;cursor:pointer;color:var(--grey);display:flex;align-items:center;justify-content:center;transition:color .2s}
    .pw-eye:hover{color:var(--white)}
    /* Strength bar */
    .str-bar{height:3px;background:var(--border);margin-top:5px;border-radius:2px;overflow:hidden}
    .str-fill{height:100%;width:0;transition:width .3s,background .3s;border-radius:2px}
    .str-label{font-family:var(--font-head);font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;color:var(--grey)}
    .err{color:#ff4444;font-size:.82rem;font-family:var(--font-head);font-weight:600;letter-spacing:.04em;display:none;padding:10px;border:1px solid #ff4444;text-align:center;margin-bottom:8px}
    .suc{color:#4caf50;font-size:.82rem;font-family:var(--font-head);font-weight:600;letter-spacing:.04em;display:none;padding:10px;border:1px solid #4caf50;text-align:center;margin-bottom:8px}
    .forgot-link{display:block;text-align:center;margin-top:14px;color:var(--grey);font-family:var(--font-head);font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:color .2s}
    .forgot-link:hover{color:var(--red)}
    .back-link{display:block;text-align:center;margin-top:22px;color:var(--grey);font-family:var(--font-head);font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:color .2s}
    .back-link:hover{color:var(--white)}
    .loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:999;display:none;align-items:center;justify-content:center;gap:14px;font-family:var(--font-head);font-size:.88rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--white)}
    .loading-overlay.show{display:flex}
    .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div class="hero-bg" style="position:fixed;inset:0;"><div class="hero-grid"></div><div class="hero-glow"></div></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div><span id="load-msg">Signing in...</span></div>

<div class="portal-wrap">
  <div class="portal-card">
    <img src="logo.jpg" alt="Apex Lift Solutions" class="portal-logo"/>
    <div class="portal-tabs">
      <button class="portal-tab active" onclick="switchTab('login',this)">Sign In</button>
      <button class="portal-tab" onclick="switchTab('register',this)">Register</button>
    </div>

    <!-- SIGN IN -->
    <div class="tab-content active" id="tab-login">
      <div class="portal-title">Client <em>Login</em></div>
      <p class="portal-sub">Access your quotes, invoices, and service history.</p>
      <div class="fg">
        <label>Email Address</label>
        <input type="text" id="login-email" placeholder="email" autocomplete="email"/>
      </div>
      <div class="fg">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"/>
          <button type="button" class="pw-eye" onclick="togglePw('login-pass',this)" title="Show/hide password">
            <svg id="eye-login" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="err" id="login-err"></div>
      <button class="btn-primary" onclick="handleLogin()" style="width:100%;margin-top:4px;">Sign In</button>
      <a href="portal-forgot.html" class="forgot-link">Forgot your password?</a>
    </div>

    <!-- REGISTER -->
    <div class="tab-content" id="tab-register">
      <div class="portal-title">Create <em>Account</em></div>
      <p class="portal-sub">New customer? Register below — we'll activate your account within 1 business day.</p>
      <div class="fg"><label>Full Name *</label><input type="text" id="reg-name" placeholder="John Smith" autocomplete="name"/></div>
      <div class="fg"><label>Company Name</label><input type="text" id="reg-company" placeholder="Your Company LLC" autocomplete="organization"/></div>
      <div class="fg"><label>Email Address *</label><input type="email" id="reg-email" placeholder="you@company.com" autocomplete="email"/></div>
      <div class="fg"><label>Phone Number</label><input type="tel" id="reg-phone" placeholder="(555) 000-0000" autocomplete="tel"/></div>
      <div class="fg">
        <label>Password * <span style="color:var(--grey);font-weight:400;font-size:.68rem;">(min 8 characters)</span></label>
        <div class="pw-wrap">
          <input type="password" id="reg-pass" placeholder="Create a password" autocomplete="new-password" oninput="checkStrength(this.value)"/>
          <button type="button" class="pw-eye" onclick="togglePw('reg-pass',this)" title="Show/hide password">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="str-bar"><div class="str-fill" id="str-fill"></div></div>
        <div class="str-label" id="str-label"></div>
      </div>
      <div class="fg">
        <label>Confirm Password *</label>
        <div class="pw-wrap">
          <input type="password" id="reg-pass2" placeholder="Repeat password" autocomplete="new-password"/>
          <button type="button" class="pw-eye" onclick="togglePw('reg-pass2',this)" title="Show/hide password">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="err" id="reg-err"></div>
      <div class="suc" id="reg-suc"></div>
      <button class="btn-primary" onclick="handleRegister()" style="width:100%;margin-top:4px;">Create Account</button>
    </div>

    <a href="index.html" class="back-link">← Back to Website</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPA_URL    = 'https://cjtezsgfdfijmdxzzbiq.supabase.co';
  const SUPA_KEY    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqdGV6c2dmZGZpam1keHp6YmlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjg2OTIsImV4cCI6MjA5Mzc0NDY5Mn0.FkfIFgm5TUKa05nK4QQWdBRgK2cv3oPvq5MQArEUqbw';
  const ADMIN_EMAIL = 'admin@apexliftsolutionsusa.com';
  const _sb = supabase.createClient(SUPA_URL, SUPA_KEY);

  // Track active tab so Enter key fires the right function
  let _activeTab = 'login';

  // ── UI HELPERS ───────────────────────────────────────────────────────
  function showLoad(on, msg) {
    document.getElementById('loading').className = on ? 'loading-overlay show' : 'loading-overlay';
    if (msg) document.getElementById('load-msg').textContent = msg;
  }
  function showErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.style.display = 'block';
  }
  function clearErr(id) { document.getElementById(id).style.display = 'none'; }

  // ── TAB SWITCHING ────────────────────────────────────────────────────
  function switchTab(tab, btn) {
    _activeTab = tab;
    document.querySelectorAll('.portal-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    btn.classList.add('active');
    clearErr('login-err'); clearErr('reg-err');
    document.getElementById('reg-suc').style.display = 'none';
  }

  // ── PASSWORD EYE TOGGLE ──────────────────────────────────────────────
  const SVG_EYE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const SVG_OFF = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

  function togglePw(inputId, btn) {
    const inp = document.getElementById(inputId);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.innerHTML = show ? SVG_OFF : SVG_EYE;
  }

  // ── PASSWORD STRENGTH ────────────────────────────────────────────────
  function checkStrength(val) {
    const fill  = document.getElementById('str-fill');
    const label = document.getElementById('str-label');
    if (!val) { fill.style.width = '0'; label.textContent = ''; return; }
    let score = 0;
    if (val.length >= 8)           score++;
    if (val.length >= 12)          score++;
    if (/[A-Z]/.test(val))         score++;
    if (/[0-9]/.test(val))         score++;
    if (/[^A-Za-z0-9]/.test(val))  score++;
    const levels = [
      { w:'15%', c:'#cc0000', t:'Too weak'  },
      { w:'35%', c:'#ff6600', t:'Weak'      },
      { w:'58%', c:'#ffaa00', t:'Fair'      },
      { w:'80%', c:'#88cc00', t:'Good'      },
      { w:'100%',c:'#4caf50', t:'Strong ✓'  }
    ];
    const l = levels[Math.min(score, 4)];
    fill.style.width      = l.w;
    fill.style.background = l.c;
    label.textContent     = l.t;
    label.style.color     = l.c;
  }

  // ── LOGIN ────────────────────────────────────────────────────────────
  async function handleLogin() {
    let email = document.getElementById('login-email').value.trim().toLowerCase();
    const pass = document.getElementById('login-pass').value;
    clearErr('login-err');

    if (!email) { showErr('login-err', 'Please enter your email address.'); return; }
    if (!pass)  { showErr('login-err', 'Please enter your password.'); return; }

    // Admin shortcut — type "admin" instead of full email
    if (email === 'admin') email = ADMIN_EMAIL;

    showLoad(true, 'Signing in...');

    try {
      const { data, error } = await _sb.auth.signInWithPassword({ email, password: pass });

      if (error) {
        showLoad(false);
        showErr('login-err', 'Incorrect email or password. Please try again.');
        return;
      }

      // Admin → straight to admin portal
      if (email === ADMIN_EMAIL) {
        window.location.href = 'portal-admin.html';
        return;
      }

      // Customer → check activation status
      const { data: profile } = await _sb.from('customers').select('*').eq('id', data.user.id).single();
      showLoad(false);

      if (!profile) {
        await _sb.auth.signOut();
        showErr('login-err', 'Account not found. Please contact us at (516) 644-7187.');
        return;
      }
      if (profile.status === 'pending') {
        await _sb.auth.signOut();
        showErr('login-err', "Your account is pending activation. We'll contact you within 1 business day.");
        return;
      }
      if (profile.status === 'inactive') {
        await _sb.auth.signOut();
        showErr('login-err', 'Your account has been deactivated. Please call (516) 644-7187.');
        return;
      }

      window.location.href = 'portal-customer.html';

    } catch(e) {
      showLoad(false);
      console.error('Login error:', e);
      showErr('login-err', 'Connection error. Please check your internet and try again.');
    }
  }

  // ── REGISTER ─────────────────────────────────────────────────────────
  async function handleRegister() {
    const name    = document.getElementById('reg-name').value.trim();
    const company = document.getElementById('reg-company').value.trim();
    const email   = document.getElementById('reg-email').value.trim().toLowerCase();
    const phone   = document.getElementById('reg-phone').value.trim();
    const pass    = document.getElementById('reg-pass').value;
    const pass2   = document.getElementById('reg-pass2').value;
    const suc     = document.getElementById('reg-suc');
    clearErr('reg-err');
    suc.style.display = 'none';

    if (!name)  { showErr('reg-err', 'Please enter your full name.'); return; }
    if (!email) { showErr('reg-err', 'Please enter your email address.'); return; }
    if (!email.includes('@')) { showErr('reg-err', 'Please enter a valid email address.'); return; }
    if (!pass)  { showErr('reg-err', 'Please create a password.'); return; }
    if (pass.length < 8) { showErr('reg-err', 'Password must be at least 8 characters.'); return; }
    if (pass !== pass2)  { showErr('reg-err', 'Passwords do not match.'); return; }

    showLoad(true, 'Creating your account...');

    try {
      const { data, error } = await _sb.auth.signUp({
        email, password: pass,
        options: { data: { name, company, phone } }
      });

      if (error) {
        showLoad(false);
        if (error.message.toLowerCase().includes('already')) {
          showErr('reg-err', 'This email is already registered. Try signing in instead.');
        } else {
          showErr('reg-err', error.message || 'Registration failed. Please try again.');
        }
        return;
      }

      // Insert customer profile row
      if (data.user) {
        const { error: pErr } = await _sb.from('customers').insert({
          id:      data.user.id,
          email,   name,
          company: company || '',
          phone:   phone   || '',
          status:  'pending',
          since:   new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
        });
        if (pErr) console.warn('Profile insert warning:', pErr.message);
      }

      // Sign out immediately — wait for admin activation
      await _sb.auth.signOut();
      showLoad(false);

      suc.textContent = `\u2713 Account created! We'll review and activate it within 1 business day. You'll hear from us at ${email}.`;
      suc.style.display = 'block';
      ['reg-name','reg-email','reg-pass','reg-pass2','reg-company','reg-phone']
        .forEach(id => { document.getElementById(id).value = ''; });
      checkStrength(''); // reset strength bar

    } catch(e) {
      showLoad(false);
      console.error('Register error:', e);
      showErr('reg-err', 'Connection error. Please try again.');
    }
  }

  // ── ENTER KEY — fires correct function for active tab ────────────────
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (_activeTab === 'login')    handleLogin();
    else if (_activeTab === 'register') handleRegister();
  });

  // ── AUTO-REDIRECT if already logged in ──────────────────────────────
  (async () => {
    try {
      const { data: { session } } = await _sb.auth.getSession();
      if (session) {
        window.location.href = session.user.email === ADMIN_EMAIL
          ? 'portal-admin.html' : 'portal-customer.html';
      }
    } catch(e) { /* stay on page */ }
  })();
</script>
</body>
</html>
