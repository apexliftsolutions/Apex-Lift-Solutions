<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Lift Solutions — Private Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #cc0000;
      --black: #0a0a0a;
      --dark: #111111;
      --border: rgba(255,255,255,0.08);
      --grey: #888888;
      --white: #f5f5f5;
    }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(204,0,0,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(204,0,0,0.07) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
      pointer-events: none;
    }
    .glow {
      position: fixed;
      top: 20%; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(204,0,0,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .box {
      position: relative;
      background: var(--dark);
      border: 1px solid var(--border);
      border-top: 3px solid var(--red);
      padding: 56px 48px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeUp 0.5s ease forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo-apex {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--red);
      letter-spacing: 0.05em;
      line-height: 1;
      display: block;
    }
    .logo-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--white);
      text-transform: uppercase;
      display: block;
      margin-bottom: 32px;
    }
    .lock { font-size: 2rem; margin-bottom: 16px; display: block; }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    p {
      color: var(--grey);
      font-size: 0.88rem;
      margin-bottom: 28px;
    }
    input[type="password"] {
      width: 100%;
      background: var(--black);
      border: 1px solid var(--border);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      font-size: 1rem;
      padding: 14px 16px;
      outline: none;
      text-align: center;
      letter-spacing: 0.2em;
      margin-bottom: 16px;
      transition: border-color 0.2s;
      border-radius: 0;
    }
    input[type="password"]:focus { border-color: var(--red); }
    button {
      width: 100%;
      background: var(--red);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 14px;
      border: none;
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      transition: background 0.2s;
    }
    button:hover { background: #a00000; }
    .error {
      display: none;
      color: #ff4444;
      font-size: 0.85rem;
      margin-top: 14px;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow"></div>
  <div class="box">
    <span class="logo-apex">APEX</span>
    <span class="logo-sub">LIFT SOLUTIONS</span>
    <span class="lock">🔒</span>
    <h1>Private Preview</h1>
    <p>This site is under construction.<br/>Enter the password to continue.</p>
    <input type="password" id="pwd" placeholder="••••••••••" autofocus />
    <button onclick="checkPassword()">Enter Site</button>
    <div class="error" id="err">Incorrect password. Try again.</div>
  </div>

  <script>
    // Check if already authenticated this session
    if (sessionStorage.getItem('apex_auth') === 'true') {
      window.location.href = 'index.html';
    }

    // Allow pressing Enter to submit
    document.getElementById('pwd').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkPassword();
    });

    function checkPassword() {
      const input = document.getElementById('pwd').value;
      if (input === 'poopjizzle') {
        sessionStorage.setItem('apex_auth', 'true');
        window.location.href = 'index.html';
      } else {
        document.getElementById('err').style.display = 'block';
        document.getElementById('pwd').value = '';
        document.getElementById('pwd').focus();
      }
    }
  </script>
</body>
</html>
